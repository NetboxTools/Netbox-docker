variables:
  # Azure Resource Manager service connection (workload identity federation) for the target subscription
  serviceConnection: 'sc-netbox-prod'
  resourceGroupName: 'rg-netbox-prod'
  location: 'swedencentral'
  # Pin to a specific netbox-docker tag (e.g. v4.x.y-3.x.y) once the first deployment is verified
  netboxBaseImage: 'docker.io/netboxcommunity/netbox:latest'
  # Official Docker Hub redis image, imported into the registry. Pin an exact tag and bump it deliberately.
  redisImage: 'redis:8.10.2-alpine'
  # Entra sign-in name (UPN) of the first NetBox superuser. Must match the case used in Entra.
  initialSuperuserUpn: ''
